[package]
name = "rmk-silakka54"
version = "0.0.0"
edition = "2024"

[dependencies]
rmk = { git = "https://github.com/HaoboGu/rmk", rev = "a019774356d3ef036ae7bfe135739b69488977f2", default-features = false, features = [ "rp2040", "split", "storage", "vial", "vial_lock", "usb_log", "rp2040", "async_matrix" ] }
#rmk = { path = "../rmk/rmk", default-features = false, features = [ "rp2040", "split", "storage", "vial", "vial_lock", "usb_log", "rp2040", "async_matrix" ] }
embassy-time = { version = "0.5" }
embassy-rp = { version = "0.10", features = [
    "rp2040",
    "time-driver",
    "critical-section-impl",
] }
embassy-executor = { version = "0.10", features = [
    "platform-cortex-m",
    "executor-thread",
] }
embassy-futures = { version = "0.1" }
cortex-m-rt = "0.7.5"
portable-atomic = { version = "1.11", features = ["critical-section"] }

# XXX: `rmk` macros unconditionally use `defmt` in the peripheral build.
# We should fix this, but for now, add the dependency.
defmt = "1.0"
defmt-rtt = "1.0"

panic-probe = { version = "1.0" }
static_cell = "2"

# [features]
# avoid having to use --allow-multiple-definition linker flag
# on macOS with Apple Silicon at least
# default = ["rp-pico/disable-intrinsics"]

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

# Split keyboard example
[[bin]]
name = "central"
path = "src/central.rs"

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"

[profile.dev]
codegen-units = 1      # better optimizations
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1       # better optimizations
debug = true            # no overhead for bare-metal
opt-level = "z"         # optimize for binary size
overflow-checks = false
lto = "fat"
